<svg xmlns="http://www.w3.org/2000/svg" width="760" height="150" viewBox="0 0 760 150">
  <defs>
    <linearGradient id="cyberBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#60CDFF"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60CDFF"/>
      <stop offset="100%" stop-color="#005A9E"/>
    </linearGradient>
  </defs>
  <style>
    .card { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 12; }
    .title { font-family: 'Cascadia Code', Consolas, monospace; font-size: 13px; fill: #60CDFF; font-weight: bold; letter-spacing: 0.5px; }
    .track { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; fill: #f0f6fc; font-weight: 700; }
    .artist { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #8b949e; }
    .badge { font-family: 'Cascadia Code', Consolas, monospace; font-size: 10px; font-weight: 600; fill: #00D2FF; }
    .badge-bg { fill: #102a45; stroke: #0078D4; rx: 4; }
    .eq-bar { animation: eq 1.4s ease-in-out infinite alternate; transform-origin: bottom; }
    @keyframes eq {
      0% { height: 6px; }
      50% { height: 32px; }
      100% { height: 16px; }
    }
    .b1 { animation-delay: 0.1s; }
    .b2 { animation-delay: 0.4s; }
    .b3 { animation-delay: 0.2s; }
    .b4 { animation-delay: 0.6s; }
    .b5 { animation-delay: 0.3s; }
    .b6 { animation-delay: 0.5s; }
    .b7 { animation-delay: 0.15s; }
    .b8 { animation-delay: 0.35s; }
  </style>

  <!-- Background Card -->
  <rect width="758" height="148" x="1" y="1" class="card" />

  <!-- Equalizer / Visualizer Icon on the left -->
  <g transform="translate(24, 45)">
    <!-- Vinyl / Headphone circle badge -->
    <circle cx="30" cy="30" r="30" fill="#161b22" stroke="#0078D4" stroke-width="1.5"/>
    <!-- Headphone SVG icon -->
    <path d="M19 28 A 11 11 0 0 1 41 28 V 36 A 3 3 0 0 1 38 39 H 37 A 2 2 0 0 1 35 37 V 30 A 2 2 0 0 1 37 28 H 39 A 9 9 0 0 0 21 28 H 23 A 2 2 0 0 1 25 30 V 37 A 2 2 0 0 1 23 39 H 22 A 3 3 0 0 1 19 36 Z" fill="#60CDFF"/>
  </g>

  <!-- Track Info -->
  <g transform="translate(100, 36)">
    <text x="0" y="0" class="title">DESKTOP AUDIO</text>
    <text x="0" y="26" class="track">Local lossless playback</text>
    <text x="0" y="48" class="artist">Moondrop Dawn Pro · 2× CS43131 · 4.4 mm output</text>

    <!-- Badges -->
    <g transform="translate(0, 62)">
      <rect x="0" y="0" width="108" height="20" class="badge-bg"/>
      <text x="54" y="14" text-anchor="middle" class="badge">FLAC / DSD</text>

      <rect x="116" y="0" width="85" height="20" class="badge-bg"/>
      <text x="158" y="14" text-anchor="middle" class="badge">WASAPI</text>

      <rect x="209" y="0" width="85" height="20" class="badge-bg"/>
      <text x="251" y="14" text-anchor="middle" class="badge">EQ PROFILE</text>
    </g>
  </g>

  <!-- Animated Spectrum Visualizer on the right with comfortable spacing -->
  <g transform="translate(650, 105) scale(1, -1)">
    <rect x="0" y="0" width="6" height="15" rx="2" fill="url(#barGrad)" class="eq-bar b1"/>
    <rect x="10" y="0" width="6" height="22" rx="2" fill="url(#barGrad)" class="eq-bar b2"/>
    <rect x="20" y="0" width="6" height="32" rx="2" fill="url(#barGrad)" class="eq-bar b3"/>
    <rect x="30" y="0" width="6" height="18" rx="2" fill="url(#barGrad)" class="eq-bar b4"/>
    <rect x="40" y="0" width="6" height="26" rx="2" fill="url(#barGrad)" class="eq-bar b5"/>
    <rect x="50" y="0" width="6" height="35" rx="2" fill="url(#barGrad)" class="eq-bar b6"/>
    <rect x="60" y="0" width="6" height="16" rx="2" fill="url(#barGrad)" class="eq-bar b7"/>
    <rect x="70" y="0" width="6" height="24" rx="2" fill="url(#barGrad)" class="eq-bar b8"/>
  </g>
</svg>
